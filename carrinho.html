<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  function renderCart() {
    var cart = getCart();
    var root = document.getElementById('cart-root');

    if (cart.length === 0) {
      root.innerHTML = '<div class="empty-cart"><h2>Seu carrinho está vazio</h2><p class="mt-1">Que tal dar uma olhada na coleção Brasilidades?</p><a href="loja.html" class="btn btn-primary mt-2">Ir para a loja</a></div>';
      return;
    }

    var rows = cart.map(function (item, i) {
      var customMeta = '';
      if (item.customization && (item.customization.paraQuem || item.customization.historia)) {
        customMeta = '<div class="meta">Personalização: ' +
          [item.customization.paraQuem, item.customization.historia].filter(Boolean).join(' — ') +
        '</div>';
      }
      return '<tr>' +
        '<td><div class="cart-item-info"><div class="cart-thumb ph-' + item.theme + '"></div><div><h4>' + item.name + '</h4><div class="meta">Tamanho: ' + item.size + '</div>' + customMeta + '<button class="remove-btn" data-index="' + i + '">Remover</button></div></div></td>' +
        '<td><div class="qty-control"><button data-minus="' + i + '">&minus;</button><span>' + item.qty + '</span><button data-plus="' + i + '">&plus;</button></div></td>' +
        '<td>' + formatPrice(item.price) + '</td>' +
        '<td>' + formatPrice(item.price * item.qty) + '</td>' +
      '</tr>';
    }).join('');

    var total = getCartTotal();

    root.innerHTML =
      '<div class="grid" style="grid-template-columns:2fr 1fr;gap:48px;align-items:flex-start;">' +
        '<table class="cart-table"><thead><tr><th>Produto</th><th>Quantidade</th><th>Preço</th><th>Subtotal</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        '<div class="cart-summary">' +
          '<h3 style="margin-bottom:18px;">Resumo</h3>' +
          '<div class="summary-row"><span>Subtotal</span><span>' + formatPrice(total) + '</span></div>' +
          '<div class="summary-row"><span>Frete</span><span>Calculado no checkout</span></div>' +
          '<div class="summary-row total"><span>Total</span><span>' + formatPrice(total) + '</span></div>' +
          '<a href="checkout.html" class="btn btn-primary btn-block mt-2">Finalizar compra</a>' +
          '<a href="loja.html" class="link-underline mt-1" style="display:inline-block;">Continuar comprando</a>' +
        '</div>' +
      '</div>';

    root.querySelectorAll('[data-minus]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.dataset.minus;
        updateCartQty(i, getCart()[i].qty - 1);
        renderCart();
      });
    });
    root.querySelectorAll('[data-plus]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.dataset.plus;
        updateCartQty(i, getCart()[i].qty + 1);
        renderCart();
      });
    });
    root.querySelectorAll('.remove-btn').forEach(function (b) {
      b.addEventListener('click', function () {
        removeFromCart(+b.dataset.index);
        renderCart();
      });
    });
  }

  renderCart();
</script>
</body>
</html>
